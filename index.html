<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RENAISSANCE — A reinvenção do mundo</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{--ink:#0B1018;--iv:#F4F0E8;--bl:#607CFF;--cr:#9E3545;--go:#C6A15B;--gd:#7a5c1e;--ez:cubic-bezier(.7,0,.2,1);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--iv);font:17px/1.65 Manrope,system-ui,sans-serif;overflow:hidden}
h1,h2,h3,h4{font-family:'Bodoni Moda',Georgia,serif;font-weight:500;margin:0}a{color:inherit;text-decoration:none}
#stage{position:fixed;inset:0;z-index:0}#c{width:100%;height:100%;display:block;touch-action:none}
body:not(.home):not(.chap) #stage{display:none}
body.chap #stage{left:40%}body.chap.flip #stage{left:0;right:40%}
#fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--iv);font:italic 500 24px 'Bodoni Moda',Georgia,serif}
#top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 28px 18px;color:#fff;mix-blend-mode:difference;font:700 11px Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase}
#top nav{display:flex;gap:26px}#wm{font:700 14px 'Bodoni Moda',Georgia,serif;letter-spacing:.3em}
#home{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6vw calc(7vh + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,#0B1018d9,#0B101800 62%)}
#home>*{pointer-events:auto}
#home h1{font-size:clamp(50px,12.5vw,190px);line-height:.9;font-weight:700;letter-spacing:-.02em;pointer-events:none}
.ch{display:inline-block;animation:ltr 1.1s var(--ez) both;animation-delay:calc(var(--i)*60ms)}
@keyframes ltr{from{opacity:0;transform:translateY(60%) rotate(4deg);filter:blur(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.sub{font:italic 500 clamp(24px,3.4vw,44px) 'Bodoni Moda',Georgia,serif;margin:14px 0 6px;animation:rise 1s .9s both}
.ph{max-width:470px;color:#F4F0E8c4;margin:0 0 26px;animation:rise 1s 1.1s both}
.row{display:flex;gap:12px;flex-wrap:wrap;animation:rise 1s 1.3s both}
.cta{display:inline-block;font:700 12px Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:16px 26px;cursor:pointer;border:1px solid var(--iv);background:none;color:var(--iv);transition:.3s}
.cta:hover{background:var(--iv);color:var(--ink)}.cta.s{background:var(--iv);color:var(--ink)}.cta.s:hover{background:var(--cr);border-color:var(--cr);color:var(--iv)}
#vp{position:absolute;right:0;top:0;width:44vw;max-width:620px;opacity:.3;pointer-events:none}
#yr{position:absolute;right:26px;bottom:7vh;writing-mode:vertical-rl;color:var(--go);letter-spacing:.3em;font:700 11px Manrope,sans-serif;pointer-events:none}
#tx{position:fixed;top:0;bottom:0;left:0;width:40%;z-index:10;background:var(--iv);color:var(--ink);overflow-y:auto;padding:104px 5vw 44px}
body.flip #tx{left:auto;right:0}
#tx>*{animation:rise .8s var(--ez) both}#tx>:nth-child(2){animation-delay:.08s}#tx>:nth-child(3){animation-delay:.14s}#tx>:nth-child(n+4){animation-delay:.2s}
.num{font:700 clamp(110px,15vw,230px)/.8 'Bodoni Moda',Georgia,serif;color:transparent;-webkit-text-stroke:1.5px var(--ink);margin-left:-.04em}
.eb{font:700 11px Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--cr);margin:26px 0 8px}
#tx h1{font-size:clamp(32px,3.6vw,52px);line-height:1.05;margin-bottom:16px}
.lead{font-size:19px;line-height:1.55;margin:0 0 20px}
#tx ul{list-style:none;padding:0;margin:0 0 22px}
#tx li{border-top:1px solid #0B101826;padding:11px 0;font-size:15.5px}
#tx li.lb{display:grid;grid-template-columns:8em 1fr;gap:14px}#tx li b{font:700 11px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gd);padding-top:3px}
#tx li.on{background:#607CFF1f}#tx li.off{opacity:.45}
.mem{background:var(--cr);color:var(--iv);padding:18px 22px;font:italic 500 23px/1.3 'Bodoni Moda',Georgia,serif}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 0 22px;border:1px solid var(--ink)}.cmp div{padding:14px}.cmp div+div{background:var(--ink);color:var(--iv)}.cmp h4{font-size:20px}.cmp p{margin:4px 0 0;font-size:14px}
.nv{display:flex;justify-content:space-between;margin:30px 0 14px}.lk{background:none;border:0;border-bottom:1px solid currentColor;color:inherit;font:700 11px Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:4px 0;cursor:pointer}.lk:hover{color:var(--cr)}
#seg{display:flex;gap:3px}#seg i{flex:1;height:4px;background:#0B101822}#seg i.v{background:var(--ink)}#seg i.c{background:var(--cr)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips button{border:1px solid var(--ink);background:none;color:var(--ink);padding:5px 11px;font:700 10px Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.chips button.on{background:var(--ink);color:var(--iv)}
#map{width:100%;max-width:340px;display:block;margin:0 0 18px}#map circle{cursor:pointer;transition:.3s}#map circle:hover{r:11}
#sc{position:absolute;left:24px;right:24px;bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:5}
#sb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:auto}
.sbtn,#sb label{background:#0B1018b3;border:1px solid #F4F0E866;color:var(--iv);padding:9px 14px;font:700 11px Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
.sbtn:hover{background:var(--iv);color:var(--ink)}#sb label{cursor:default}#sb input{vertical-align:middle;accent-color:var(--bl)}
#cap{max-width:540px;font-size:14px;line-height:1.5;color:#F4F0E8d9;margin:0;text-shadow:0 1px 10px #000}
.pg{position:fixed;inset:0;z-index:12;overflow:auto;padding:110px 6vw 60px}
#idx{background:var(--iv);color:var(--ink)}#tl,#qz,#fn{background:var(--ink)}
.pg h2{font-size:clamp(44px,8vw,120px);line-height:.95;margin-bottom:30px;font-weight:700}
#gr{display:grid;grid-template-rows:repeat(8,auto);grid-auto-flow:column;gap:0 60px}
#gr a{display:grid;grid-template-columns:5.2rem 1fr;align-items:baseline;border-top:1px solid var(--ink);padding:14px 0;transition:.3s var(--ez)}
#gr a:hover{padding-left:16px;color:var(--cr)}#gr span{font:700 46px 'Bodoni Moda',Georgia,serif;color:transparent;-webkit-text-stroke:1px currentColor}#gr a.v span{color:var(--cr);-webkit-text-stroke:0}
#gr em{font:500 28px 'Bodoni Moda',Georgia,serif;font-style:normal}
.tr{display:flex;gap:46px;overflow-x:auto;padding:20px 0 30px;border-bottom:1px solid #F4F0E833}
.tr button{flex:0 0 auto;background:none;border:0;color:transparent;-webkit-text-stroke:1px var(--iv);font:700 clamp(54px,9vw,120px) 'Bodoni Moda',Georgia,serif;cursor:pointer;transition:.3s}
.tr button.on{color:var(--go);-webkit-text-stroke:0}.td{max-width:680px;padding-top:26px}.td h3{font-size:34px;margin-bottom:8px}
.q{max-width:760px}.q h3{font-size:clamp(24px,3vw,38px);margin-bottom:20px}.q button.o{display:grid;grid-template-columns:2.2em 1fr;width:100%;text-align:left;margin:8px 0;padding:16px 18px;background:none;border:1px solid #F4F0E855;color:var(--iv);font:17px Manrope,sans-serif;cursor:pointer}
.q button.o:hover{border-color:var(--bl)}.q .ok{background:var(--bl);border-color:var(--bl);color:var(--ink)}.q .no{background:var(--cr);border-color:var(--cr)}
#fn a{border-bottom:1px solid var(--go);color:var(--go)}#fn li{margin:12px 0}
#cu{position:fixed;inset:0;z-index:60;background:var(--cr);transform:translateY(101%);pointer-events:none}
#cu.in{transition:transform .45s var(--ez);transform:none}#cu.out{transition:transform .55s var(--ez);transform:translateY(-101%)}
@media(max-width:860px){body.chap #stage,body.chap.flip #stage{left:0;right:0;bottom:auto;height:44vh}
#tx,body.flip #tx{width:100%;left:0;right:0;top:44vh;padding:26px 22px 40px}.num{font-size:84px}
#top nav a:nth-child(n+3){display:none}#top{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px}
#gr{display:block}#sc{left:12px;right:12px;bottom:10px}#cap{font-size:12px}
#home h1{font-size:15vw}#vp,#yr{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="fb" hidden></div><div id="sc"><div id="sb"></div><p id="cap"></p></div></div>
<header id="top"><a href="#/" id="wm">RENAISSANCE</a><nav><a href="#/i">Capítulos</a><a href="#/l">Linha temporal</a><a href="#/q">Quiz</a><a href="#/f">Fontes</a></nav><span id="pr"></span></header>
<main id="home" hidden>
<svg id="vp" viewBox="0 0 300 300" fill="none" stroke="#F4F0E8" stroke-width=".6"><path d="M0 0L300 300M60 0L300 300M120 0L300 300M180 0L300 300M240 0L300 300M300 0V300M0 60L300 300M0 120L300 300M0 180L300 300M0 240L300 300"/><rect x="150" y="150" width="150" height="150"/><rect x="225" y="225" width="75" height="75"/></svg>
<h1 id="hn" aria-label="RENAISSANCE"></h1>
<div class="sub">A reinvenção do mundo.</div>
<p class="ph">Uma viagem pela arte, pela ciência e pelas ideias que transformaram a Europa.</p>
<div class="row"><button class="cta s" id="go1">INICIAR EXPERIÊNCIA</button><a class="cta" href="#/i">EXPLORAR OS 16 CAPÍTULOS</a></div>
<div id="yr">SÉCULOS XV — XVI</div>
</main>
<aside id="tx" hidden></aside>
<section class="pg" id="idx" hidden></section><section class="pg" id="tl" hidden></section><section class="pg" id="qz" hidden></section><section class="pg" id="fn" hidden></section>
<div id="cu"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches,B=document.body;
const M=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const limb=(a,b,r,m)=>{const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),m);o.position.copy(A).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return o};
const box=(g,sx,sy,sz,x,y,z,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;g.add(o);return o};
const lab=t=>{const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.font='30px Georgia';x.fillStyle='#F1E8D5';x.textAlign='center';x.fillText(t,128,40);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(2.4,.6,1);return s};
const TOPICS=[
{n:1,t:'Teocentrismo',s:'orb',q:'Visão filosófica e religiosa que coloca Deus no centro da compreensão do mundo e da existência humana.',p:['Idade Média — a religião orientava a vida, o saber e a arte.','A Igreja tinha grande influência na educação e na cultura.','A arquitetura gótica das catedrais exprimia esta visão do mundo.','A esfera luminosa é uma representação simbólica. No Renascimento, cresce a atenção ao ser humano (tópico 3).'],r:'Teocentrismo = Deus no centro.'},
{n:2,t:'As grandes transformações',s:'orb',q:'Nos séculos XV e XVI, a ciência, os Descobrimentos e a economia mudaram a forma de ver e viver o mundo.',p:['Ciência — valorização da observação, da experiência e da investigação. Ideias antigas sobre a natureza foram questionadas.','Alimentação e Descobrimentos — novos produtos circularam entre continentes e chegaram gradualmente à Europa. Os hábitos mudaram ao longo do tempo.','Economia — expansão do comércio marítimo, circulação de mercadorias e procura do lucro. Desenvolve-se o capitalismo comercial.','A fé continuou muito importante: a ciência não a substituiu de imediato.'],r:'Ciência, comércio e descobertas transformaram gradualmente a Europa.'},
{n:3,t:'Antropocentrismo e Homem de Vitrúvio',s:'vit',q:'Valorização do ser humano, da sua razão, capacidade e importância.',p:['c. 1490 — Leonardo da Vinci desenha o Homem de Vitrúvio, que relaciona as proporções do corpo com a geometria (círculo e quadrado).','Inspira-se no arquiteto romano Vitrúvio.','Teocentrismo: Deus no centro. Antropocentrismo: ser humano no centro, sem abandonar a religião.','O modelo 3D é uma reconstrução artística, não o desenho original. Usa o botão para mostrar ou esconder as construções.'],r:'Antropocentrismo = ser humano no centro.'},
{n:4,t:'Nicolau Copérnico',s:'cop',q:'Astrónomo polaco (1473–1543) que defendeu o modelo heliocêntrico.',p:['Geocentrismo — modelo histórico com a Terra no centro.','Heliocentrismo — o Sol no centro do sistema planetário.','1543 — publicação de De revolutionibus orbium coelestium.','Importância — transformou a astronomia.','Usa os botões de modo, pausa e velocidade. O modelo é didático, sem escala real.'],r:'Copérnico defendeu o heliocentrismo.'},
{n:5,t:'O Renascimento',s:'palace',q:'Movimento cultural, artístico e científico dos séculos XV e XVI, inspirado na Antiguidade Clássica. Marca a transição da Idade Média para a Idade Moderna.',p:['Humanismo — interesse pelo ser humano e pelos textos clássicos.','Razão e antropocentrismo — valorização da capacidade humana.','Antiguidade Clássica — inspiração greco-romana na arte e na arquitetura.','Perspetiva e realismo — por exemplo, A Trindade de Masaccio (c. 1425–1427).','Ciência — desenvolvimento da investigação.','A religião continuou a ter grande importância.'],r:'O Renascimento valorizou o ser humano, a razão, a arte e o conhecimento.'},
{n:6,t:'Lourenço de Médici',s:'orb',q:'Político, banqueiro e mecenas florentino, conhecido como Lourenço, o Magnífico.',p:['1449 — nasce em Florença.','1469 — começa a governar Florença.','1492 — morre.','Mecenato — apoio a artistas e intelectuais, com encomendas, dinheiro ou proteção.','Verrocchio — realizou obras para os Médici, como o túmulo de Piero e Giovanni de Médici.','Botticelli — trabalhou para membros da família Médici.','Michelangelo — segundo as biografias antigas, esteve na casa de Lourenço quando jovem.','Rigor — distingue sempre o apoio direto documentado do simples ambiente cultural florentino.'],r:'Lourenço de Médici foi um importante mecenas do Renascimento.'},
{n:7,t:'O palácio renascentista',s:'palace',q:'Residência urbana de famílias ricas, organizada de forma geométrica e inspirada na arquitetura clássica.',p:['Cortile — pátio central.','Loggia — galeria aberta com arcadas.','Rusticato — revestimento de pedra de aspeto rústico e robusto.','Piano nobile — andar nobre, usado para residência e receção de convidados.','Referência — Palazzo Medici Riccardi (Michelozzo, a partir de c. 1444). O modelo do site é uma simplificação, não o edifício real.','Clica nos pontos dourados e roda a câmara.'],r:'O palácio renascentista combina organização geométrica, pátio central e elementos clássicos.'},
{n:8,t:'Figuras do Renascimento',s:'orb',q:'Galeria biográfica de uma figura política e de dois humanistas.',p:['Parte A · Lourenço de Médici (1449–1492) — mecenas e governante de Florença. Ver tópico 6.','Parte B · Erasmo de Roterdão (1466–1536) — humanista neerlandês, autor de Elogio da Loucura. Criticou defeitos da sociedade e da Igreja e defendeu o pensamento crítico e a reforma pacífica.','Parte B · Damião de Góis (1502–1574) — diplomata e historiador português, autor da Crónica de D. Manuel. Ligado ao Humanismo e aos Descobrimentos, foi perseguido pela Inquisição.'],r:'Humanistas valorizaram o pensamento crítico e o saber.'},
{n:9,t:'Palácios renascentistas italianos',s:'palace',q:'Nem todos os palácios famosos são exemplos puros do Renascimento. Aqui ficam por cidade, com a época dominante.',p:['Florença — Medici Riccardi (c. 1444), Strozzi (iniciado em 1489) e Rucellai (Alberti, c. 1446–1451): Renascimento. Pitti: obra do séc. XV muito ampliada até ao séc. XIX.','Veneza — Palazzo Ducale e Ca’ d’Oro: sobretudo gótico veneziano (sécs. XIV–XV). Vendramin Calergi (Codussi, c. 1481–1509): Renascimento. Grimani: séc. XVI, Renascimento tardio.','Roma — Cancelleria (finais do séc. XV), Farnese e Villa Farnesina (início do séc. XVI): Renascimento. Massimo alle Colonne (década de 1530): Renascimento tardio, com traços maneiristas.','Milão — Marino (a partir de 1558): maneirismo. Giureconsulti (séc. XVI): Renascimento tardio. Arcivescovile: origens medievais e várias reconstruções. Stanga: confirma a localização, pois pode situar-se em Cremona.'],r:'Há palácios góticos, renascentistas e maneiristas: a cronologia varia.'},
{n:10,t:'A imprensa de Gutenberg',s:'gut',q:'Sistema de tipos móveis desenvolvido por Johannes Gutenberg na Europa do século XV.',p:['Mais livros — produção em maior quantidade.','Ideias — difusão de textos científicos, culturais e religiosos.','Humanismo — divulgação de obras humanistas e científicas.','Alfabetização — contributo gradual, não imediato.','Clica em IMPRIMIR UMA PÁGINA.'],r:'A imprensa facilitou a reprodução e a difusão do conhecimento.'},
{n:11,t:'As indulgências',s:'orb',q:'Na doutrina católica, a indulgência é a remissão das penas temporais devidas a pecados já perdoados. Não é a compra direta do perdão.',p:['Abusos — a pregação e venda de indulgências para financiar obras, incluindo a Basílica de São Pedro, foi muito criticada.','Doutrina e prática — a doutrina oficial era distinta dos abusos históricos.','1517 — Martinho Lutero publica as 95 Teses contra esses abusos.','Importância — o conflito contribuiu para o início da Reforma Protestante.'],r:'A controvérsia das indulgências contribuiu para o início da Reforma Protestante.'},
{n:12,t:'As principais religiões protestantes',s:'orb',q:'Correntes cristãs nascidas da Reforma, com doutrinas diferentes entre si.',p:['Luteranismo — salvação pela fé. A Bíblia é a principal autoridade. Rejeita a autoridade do Papa.','Calvinismo — predestinação. Valoriza a disciplina e uma vida dedicada ao trabalho. Rejeita a autoridade do Papa.','Anglicanismo — surge com Henrique VIII. Rompe com o Papa e o rei torna-se chefe da Igreja de Inglaterra. Mantém elementos da tradição católica.'],r:'Luteranismo, calvinismo e anglicanismo são correntes diferentes da Reforma.'},
{n:13,t:'Concílio de Trento e Contrarreforma',s:'orb',q:'Concílio realizado entre 1545 e 1563, central na resposta católica à Reforma e na reforma interna da Igreja.',p:['Doutrina — reafirma o papel da fé e das boas obras.','Sacramentos — confirma os sete sacramentos.','Seminários — criados para a formação do clero.','Devoções — reafirma práticas ligadas à Virgem Maria, aos santos e às relíquias.','Disciplina — medidas para melhorar a formação dos padres.','As divisões religiosas não ficaram resolvidas.'],r:'O Concílio de Trento foi fundamental para a Contrarreforma Católica.'},
{n:14,t:'A Inquisição',s:'orb',q:'Instituição destinada a investigar e julgar pessoas suspeitas de heresia. Em Portugal, atuou sobretudo entre os séculos XVI e XIX.',p:['Investigação — começava com denúncias.','Processo — interrogatórios e julgamento, com uso de tortura em certos casos.','Penas — prisão e confisco de bens.','Execução — em casos graves, o condenado era entregue às autoridades civis.','Autos de fé — anúncio público das sentenças.','Esta perseguição religiosa é estudada com rigor histórico, sem glorificação.'],r:'A Inquisição procurava combater heresias e controlar a prática religiosa através de investigação e punição.'},
{n:15,t:'Obras de arte',s:'orb',q:'Obras de épocas diferentes: só algumas pertencem ao Renascimento.',p:['A Última Ceia — Leonardo da Vinci, 1495–1498. Jesus e os apóstolos.','A Escola de Atenas — Rafael Sanzio, 1509–1511. Filósofos da Antiguidade Clássica.','A Trindade — Masaccio, c. 1425–1427. Uso pioneiro da perspetiva.','Fugindo da Crítica — Pere Borrell del Caso, 1874. Ilusionismo: a figura parece sair da moldura. Não é renascentista.','Op Art — Victor Vasarely (1906–1997). Padrões geométricos e ilusões visuais, séc. XX. Não é renascentista.','Arte sacra — arte com temas religiosos. Tríptico — obra com três painéis. Exemplo: Tríptico de Portinari (Hugo van der Goes, c. 1475–1478).'],r:'Cada obra pertence à sua época: não são todas Renascimento.'},
